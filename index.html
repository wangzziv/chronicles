<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日國學筆記</title>
  <style>
    :root {
      --bg-primary: #f8f9fa; 
      --bg-secondary: #ffffff;
      --text-main: #2b2d42; 
      --text-muted: #6c757d;
      --border-color: #e9ecef; 
      --accent-color: #8d99ae;
      --active-tab-bg: #edf2f4; 
      --active-tab-border: #2b2d42; 
      --card-bg: #fafafa;
      --quote-bg: #fafafa;
      --app-bg: #f1f3f5;
      --mindset-bg: #f8f9fa;
      --shadow-color: rgba(0,0,0,0.04);
      --tag-bg: #e9ecef;
      --tag-active-bg: #2b2d42;
      --tag-active-text: #ffffff;
    }

    [data-theme="dark"] {
      --bg-primary: #121212; 
      --bg-secondary: #1e1e1e;
      --text-main: #e0e0e0; 
      --text-muted: #a0a0a0;
      --border-color: #2d2d2d; 
      --accent-color: #718096;
      --active-tab-bg: #2a2d32; 
      --active-tab-border: #90caf9; 
      --card-bg: #242424;
      --quote-bg: #25282c;
      --app-bg: #2d3137;
      --mindset-bg: #1a1d21;
      --shadow-color: rgba(0,0,0,0.3);
      --tag-bg: #2d2d2d;
      --tag-active-bg: #90caf9;
      --tag-active-text: #121212;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
      background-color: var(--bg-primary); 
      color: var(--text-main); 
      display: flex; 
      height: 100vh; 
      overflow: hidden; 
      transition: background-color 0.3s, color 0.3s;
    }

    .mobile-header {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 56px;
      background-color: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      z-index: 1000;
      padding: 0 16px;
      align-items: center;
      justify-content: space-between;
    }
    .menu-toggle-btn {
      background: none;
      border: none;
      font-size: 1.4rem;
      color: var(--text-main);
      cursor: pointer;
      padding: 4px 8px;
    }

    .theme-toggle-btn {
      background: none;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 0.85rem;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .theme-toggle-btn:hover { background-color: var(--active-tab-bg); }

    .sidebar { 
      width: 360px; 
      background-color: var(--bg-secondary); 
      border-right: 1px solid var(--border-color); 
      display: flex; 
      flex-direction: column; 
      flex-shrink: 0; 
      transition: transform 0.3s ease, background-color 0.3s;
      z-index: 900;
    }
    .sidebar-header { 
      padding: 16px; 
      border-bottom: 1px solid var(--border-color); 
      background-color: var(--bg-secondary); 
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .sidebar-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .sidebar-header h2 { font-size: 1.1rem; font-weight: 700; color: var(--text-main); }
    
    .search-input { 
      width: 100%; 
      padding: 8px 12px; 
      border: 1px solid var(--border-color); 
      border-radius: 6px; 
      font-size: 0.88rem; 
      outline: none; 
      background-color: var(--bg-primary);
      color: var(--text-main);
    }

    /* 關鍵修復：改成多行換行自適應，不再被裁切 */
    .tag-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding-top: 2px;
    }
    
    .tag-btn {
      background-color: var(--tag-bg);
      color: var(--text-main);
      border: none;
      padding: 5px 10px;
      border-radius: 14px;
      font-size: 0.78rem;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .tag-btn:hover { opacity: 0.85; }
    .tag-btn.active {
      background-color: var(--tag-active-bg);
      color: var(--tag-active-text);
      font-weight: 600;
    }

    .bookmark-banner {
      background-color: var(--active-tab-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 8px 16px;
      font-size: 0.82rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--text-main);
    }
    .bookmark-btn {
      background: none;
      border: none;
      color: var(--active-tab-border);
      font-weight: 600;
      cursor: pointer;
      text-decoration: underline;
      font-size: 0.82rem;
    }

    .tab-list { flex: 1; overflow-y: auto; list-style: none; }
    .tab-item { 
      padding: 14px 16px; 
      border-bottom: 1px solid var(--border-color); 
      cursor: pointer; 
      border-left: 4px solid transparent; 
    }
    .tab-item:hover { background-color: var(--bg-primary); }
    .tab-item.active { 
      background-color: var(--active-tab-bg); 
      border-left-color: var(--active-tab-border); 
      font-weight: 600; 
    }
    .tab-item .lesson-num { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px; display: flex; justify-content: space-between; }
    .tab-item .lesson-title { font-size: 0.92rem; line-height: 1.4; color: var(--text-main); word-break: break-word; white-space: normal; }
    .tab-item .item-tags { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
    .tab-item .mini-tag { font-size: 0.7rem; padding: 1px 6px; border-radius: 4px; background-color: var(--border-color); color: var(--text-muted); }

    .main-content { 
      flex: 1; 
      overflow-y: auto; 
      padding: 32px 40px; 
      background-color: var(--bg-primary); 
      transition: background-color 0.3s;
    }
    .lesson-card { 
      background-color: var(--bg-secondary); 
      border: 1px solid var(--border-color); 
      border-radius: 12px; 
      padding: 32px; 
      max-width: 950px; 
      margin: 0 auto; 
      box-shadow: 0 4px 12px var(--shadow-color); 
    }
    .meta-header { border-bottom: 2px solid var(--border-color); padding-bottom: 16px; margin-bottom: 24px; }
    .meta-header .date-badge { 
      display: inline-block; 
      padding: 4px 10px; 
      background-color: var(--active-tab-bg); 
      border-radius: 4px; 
      font-size: 0.85rem; 
      color: var(--text-muted); 
      margin-bottom: 8px; 
    }
    .meta-header h1 { font-size: 1.6rem; color: var(--text-main); margin-bottom: 10px; }
    .card-tags { display: flex; gap: 8px; margin-top: 8px; }
    .card-tag-item { font-size: 0.8rem; padding: 3px 10px; border-radius: 12px; background-color: var(--active-tab-bg); color: var(--text-main); font-weight: 500; }

    .section-block { margin-bottom: 28px; }
    .section-title { font-size: 1.1rem; font-weight: 700; color: var(--text-main); margin-bottom: 12px; }
    .quote-box { 
      background-color: var(--quote-bg); 
      border-left: 4px solid var(--active-tab-border); 
      padding: 18px 22px; 
      border-radius: 0 8px 8px 0; 
      margin-bottom: 16px; 
      font-size: 0.98rem; 
      line-height: 1.7; 
    }
    .quote-item { margin-bottom: 20px; }
    .quote-item:last-child { margin-bottom: 0; }
    .app-box { 
      background-color: var(--app-bg); 
      padding: 18px 22px; 
      border-radius: 8px; 
      margin-top: 12px; 
      font-size: 0.95rem; 
      line-height: 1.7; 
    }
    .mindset-box { 
      background-color: var(--mindset-bg); 
      border: 1px dashed var(--accent-color); 
      padding: 22px; 
      border-radius: 8px; 
      line-height: 1.7; 
    }
    .empty-state { text-align: center; padding: 60px; color: var(--text-muted); }

    .overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(0,0,0,0.5);
      z-index: 850;
    }

    @media (max-width: 768px) {
      .mobile-header { display: flex; }
      body { padding-top: 56px; }
      .sidebar {
        position: fixed;
        top: 56px; bottom: 0; left: 0;
        width: 300px;
        transform: translateX(-100%);
        box-shadow: 4px 0 12px var(--shadow-color);
      }
      .sidebar.open { transform: translateX(0); }
      .overlay.active { display: block; }
      .main-content { padding: 20px 16px; }
      .lesson-card { padding: 20px; }
      .meta-header h1 { font-size: 1.3rem; }
      .sidebar-header .theme-toggle-btn { display: none; }
    }
  </style>
</head>
<body>

  <div class="mobile-header">
    <button class="menu-toggle-btn" onclick="toggleSidebar()" aria-label="選單">☰</button>
    <button class="theme-toggle-btn" onclick="toggleTheme()" id="themeBtnMobile">深色</button>
  </div>

  <div class="overlay" id="overlay" onclick="closeSidebar()"></div>

  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title-row">
        <h2>📚 每日國學筆記</h2>
        <button class="theme-toggle-btn" onclick="toggleTheme()" id="themeBtnDesktop">深色</button>
      </div>
      <input type="text" id="searchInput" class="search-input" placeholder="搜尋典故、出處、關鍵字..." oninput="filterTabs()">
      
      <div class="tag-bar" id="tagBar">
        <button class="tag-btn active" onclick="selectTag('ALL')">全部</button>
        <button class="tag-btn" onclick="selectTag('組織治理')">組織治理</button>
        <button class="tag-btn" onclick="selectTag('資源戰略')">資源戰略</button>
        <button class="tag-btn" onclick="selectTag('溝通說服')">溝通說服</button>
        <button class="tag-btn" onclick="selectTag('識人風控')">識人風控</button>
        <button class="tag-btn" onclick="selectTag('防蒙蔽')">防蒙蔽</button>
        <button class="tag-btn" onclick="selectTag('梯隊建構')">梯隊建構</button>
      </div>
    </div>

    <div class="bookmark-banner" id="bookmarkBanner" style="display: none;">
      <span>📌 上次閱讀至第 <strong id="lastLessonNum">--</strong> 課</span>
      <button class="bookmark-btn" onclick="jumpToLastRead()">前往 →</button>
    </div>

    <ul class="tab-list" id="tabList"></ul>
  </div>

  <div class="main-content" id="mainContent">
    <div class="empty-state">資料載入中...</div>
  </div>

  <script>
    let ALL_LESSONS = [];
    let currentTabId = 1;
    let selectedTag = 'ALL';

    function initTheme() {
      const savedTheme = localStorage.getItem('theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);
      updateThemeBtnUI(savedTheme);
    }

    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
      updateThemeBtnUI(newTheme);
    }

    function updateThemeBtnUI(theme) {
      const desktopBtn = document.getElementById('themeBtnDesktop');
      const mobileBtn = document.getElementById('themeBtnMobile');
      if (theme === 'dark') {
        if (desktopBtn) desktopBtn.innerHTML = '淺色';
        if (mobileBtn) mobileBtn.innerHTML = '淺色';
      } else {
        if (desktopBtn) desktopBtn.innerHTML = '深色';
        if (mobileBtn) mobileBtn.innerHTML = '深色';
      }
    }

    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('overlay');
      sidebar.classList.toggle('open');
      overlay.classList.toggle('active');
    }

    function closeSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('overlay');
      sidebar.classList.remove('open');
      overlay.classList.remove('active');
    }

    function attachAutoTags(item) {
      if (item.tags && Array.isArray(item.tags) && item.tags.length > 0) return item.tags;
      const tags = [];
      const title = item.title || '';

      if (/二柄|審官|權限|制度|治理|授權|無為|主道/.test(title)) tags.push('組織治理');
      if (/因利|利益|撥款|資源|戰略/.test(title)) tags.push('資源戰略');
      if (/計深遠|觸龍|說服|迂迴|談判|樞言/.test(title)) tags.push('溝通說服');
      if (/才德|智伯|識人|風控|選擇/.test(title)) tags.push('識人風控');
      if (/三鏡|參伍|驗證|盲抽|防蒙蔽|瑕|密察/.test(title)) tags.push('防蒙蔽');
      if (/愛子|接班|戰功|梯隊|長遠/.test(title)) tags.push('梯隊建構');

      if (tags.length === 0) tags.push('組織治理');
      return tags;
    }

    async function fetchJsonFile(fileName) {
      try {
        const res = await fetch(`./lessons/${fileName}?v=` + Date.now());
        if (res.ok) {
          const data = await res.json();
          if (Array.isArray(data)) return data;
          if (data && typeof data === 'object' && data.id) return [data];
        }
      } catch (e) {}
      return null;
    }

    async function initApp() {
      initTheme();

      let filesToLoad = [];
      const manifest = await fetchJsonFile('manifest.json');
      
      if (manifest && Array.isArray(manifest)) {
        filesToLoad = manifest;
      } else {
        filesToLoad = ['1-15.json', '16-30.json', '31-45.json', '46-60.json', '61-72.json', '83-91.json'];
      }

      const results = await Promise.all(filesToLoad.map(file => fetchJsonFile(file)));

      results.forEach(items => {
        if (items) ALL_LESSONS.push(...items);
      });

      if (ALL_LESSONS && ALL_LESSONS.length > 0) {
        const map = new Map();
        ALL_LESSONS.forEach(item => {
          if (item && item.id !== undefined) {
            item.tags = attachAutoTags(item);
            map.set(Number(item.id), item);
          }
        });
        
        ALL_LESSONS = Array.from(map.values()).sort((a, b) => b.id - a.id);
        
        checkLastReadBookmark();

        currentTabId = ALL_LESSONS[0].id;
        renderTabs(ALL_LESSONS);
        selectTab(currentTabId, false);
      } else {
        document.getElementById('mainContent').innerHTML = '<div class="empty-state">尚未讀取到資料，請確認 lessons/ 目錄。</div>';
      }
    }

    function checkLastReadBookmark() {
      const lastId = localStorage.getItem('lastReadLessonId');
      if (lastId && ALL_LESSONS.some(l => l.id === Number(lastId))) {
        document.getElementById('lastLessonNum').innerText = lastId;
        document.getElementById('bookmarkBanner').style.display = 'flex';
      }
    }

    function jumpToLastRead() {
      const lastId = Number(localStorage.getItem('lastReadLessonId'));
      if (lastId) {
        selectTab(lastId);
        closeSidebar();
      }
    }

    function selectTag(tagName) {
      selectedTag = tagName;
      const btns = document.querySelectorAll('.tag-btn');
      btns.forEach(b => {
        if (b.innerText === tagName || (tagName === 'ALL' && b.innerText === '全部')) {
          b.classList.add('active');
        } else {
          b.classList.remove('active');
        }
      });
      filterTabs();
    }

    function renderTabs(data) {
      const tabList = document.getElementById('tabList');
      tabList.innerHTML = '';
      data.forEach(item => {
        const li = document.createElement('li');
        li.className = `tab-item ${item.id === currentTabId ? 'active' : ''}`;
        li.onclick = () => {
          selectTab(item.id);
          closeSidebar();
        };

        let tagBadges = '';
        if (item.tags) {
          tagBadges = item.tags.map(t => `<span class="mini-tag">${t}</span>`).join('');
        }

        li.innerHTML = `
          <div class="lesson-num"><span>第 ${item.id} 課</span><span>${item.date}</span></div>
          <div class="lesson-title">${item.title}</div>
          <div class="item-tags">${tagBadges}</div>
        `;
        tabList.appendChild(li);
      });
    }

    function selectTab(id, saveBookmark = true) {
      currentTabId = id;
      const lesson = ALL_LESSONS.find(l => l.id === id);
      
      if (saveBookmark) {
        localStorage.setItem('lastReadLessonId', id);
        checkLastReadBookmark();
      }

      filterTabs();

      if (!lesson) return;
      const mainContent = document.getElementById('mainContent');
      let quotesHtml = '';
      lesson.quotes.forEach(q => {
        quotesHtml += `<div class="quote-item"><strong>【出處】</strong> ${q.source}<br><strong>【原文】</strong> ${q.text}<br><strong>【白話解讀】</strong> ${q.meaning}<div class="app-box"><strong>💼 現代交流與商務應用：</strong><br>${q.app}</div></div>`;
      });

      let cardTagsHtml = '';
      if (lesson.tags) {
        cardTagsHtml = lesson.tags.map(t => `<span class="card-tag-item">${t}</span>`).join('');
      }

      mainContent.innerHTML = `
        <div class="lesson-card">
          <div class="meta-header">
            <span class="date-badge">第 ${lesson.id} 課 ｜ ${lesson.date}</span>
            <h1>${lesson.title}</h1>
            <div class="card-tags">${cardTagsHtml}</div>
          </div>
          <div class="section-block">
            <div class="section-title">📄 國學經典典故（談吐墨水）</div>
            <div class="quote-box">${quotesHtml}</div>
          </div>
          <div class="section-block">
            <div class="section-title">👑 心術與權謀解析</div>
            <div class="mindset-box"><strong>【${lesson.mindset.title}】</strong><br><br>${lesson.mindset.content}</div>
          </div>
        </div>`;
    }

    function filterTabs() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = ALL_LESSONS.filter(item => {
        const matchesQuery = item.title.toLowerCase().includes(query) || 
                             String(item.id).toLowerCase().includes(query) || 
                             item.quotes.some(q => q.text.toLowerCase().includes(query) || q.source.toLowerCase().includes(query));
        
        const matchesTag = selectedTag === 'ALL' || (item.tags && item.tags.includes(selectedTag));

        return matchesQuery && matchesTag;
      });
      renderTabs(filtered);
    }

    window.onload = initApp;
  </script>
</body>
</html>
